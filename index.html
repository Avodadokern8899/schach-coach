<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schach-Coach</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">♞&#xFE0E;</span> Schach-Coach</div>
    <nav class="tabs" aria-label="Bereiche">
      <button data-view="overview" class="on">Übersicht</button>
      <button data-view="training">Training</button>
      <button data-view="theory">Theorie</button>
    </nav>
    <form id="load-form" class="load">
      <input id="username" type="text" placeholder="chess.com-Benutzername" autocomplete="off" spellcheck="false" required>
      <select id="months" title="Zeitraum">
        <option value="1">letzter Monat</option>
        <option value="3" selected>letzte 3 Monate</option>
        <option value="6">letzte 6 Monate</option>
      </select>
      <button type="submit" class="primary">Partien laden</button>
    </form>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <b>Deine Partien</b>
        <span id="game-count" class="muted"></span>
      </div>
      <div class="filters">
        <select id="filter-class">
          <option value="">Alle Zeitformate</option>
          <option value="bullet">Bullet</option>
          <option value="blitz">Blitz</option>
          <option value="rapid">Schnellschach</option>
          <option value="daily">Täglich</option>
        </select>
      </div>
      <ul id="game-list" class="game-list"></ul>
    </aside>

    <section id="content" class="content">
      <div class="welcome">
        <h1>Lerne aus deinen eigenen Partien</h1>
        <p>Gib oben deinen chess.com-Namen ein. Die App lädt deine Partien, lässt sie von der Schach-Engine <b>Stockfish</b> direkt in deinem Browser bewerten und zeigt dir, wo du dich verbessern kannst.</p>
      </div>
    </section>
  </main>

  <template id="tpl-overview">
    <div class="overview">
      <h2>Übersicht</h2>
      <div class="kpis"></div>
      <div class="cards">
        <div class="card">
          <h3>Tipps für dein Spiel</h3>
          <ul class="tips overview-tips"></ul>
          <div class="batch">
            <button class="primary batch-btn">Letzte 5 Partien analysieren</button>
            <span class="batch-status muted"></span>
          </div>
        </div>
        <div class="card">
          <h3>Eröffnungen</h3>
          <table class="table openings"></table>
        </div>
        <div class="card">
          <h3>Wie du verlierst</h3>
          <ul class="bars loss-reasons"></ul>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-game">
    <div class="game-view">
      <div class="game-head">
        <div>
          <h2 class="title"></h2>
          <div class="sub muted"></div>
        </div>
        <div class="game-actions">
          <select class="depth" title="Analysetiefe">
            <option value="10">Schnell</option>
            <option value="13" selected>Normal</option>
            <option value="16">Gründlich</option>
          </select>
          <button class="primary analyse-btn">Mit Stockfish analysieren</button>
        </div>
      </div>
      <div class="progress hidden"><div class="bar"></div><span></span></div>

      <div class="game-grid">
        <div class="board-col">
          <div class="board-wrap">
            <div class="evalbar"><div class="evalfill"></div><span class="evaltext"></span></div>
            <div class="board"></div>
          </div>
          <div class="nav">
            <button data-nav="start" title="Anfang">⏮</button>
            <button data-nav="prev" title="Zurück (←)">◀</button>
            <button data-nav="next" title="Vor (→)">▶</button>
            <button data-nav="end" title="Ende">⏭</button>
            <button data-nav="prev-error" class="err-nav" title="Vorheriger Fehler">◀ Fehler</button>
            <button data-nav="next-error" class="err-nav" title="Nächster Fehler">Fehler ▶</button>
          </div>
          <div class="move-info"></div>
        </div>
        <div class="info-col">
          <div class="graph"></div>
          <div class="summary"></div>
          <ul class="tips game-tips"></ul>
          <div class="moves"></div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
